<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Timetable - Organize Your Schedule</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-calendar-alt"></i>
                    <h1>Smart Timetable</h1>
                </div>
                <nav class="nav">
                    <button class="nav-btn active" data-view="week">
                        <i class="fas fa-calendar-week"></i>
                        Week View
                    </button>
                    <button class="nav-btn" data-view="day">
                        <i class="fas fa-calendar-day"></i>
                        Day View
                    </button>
                    <button class="add-event-btn" id="addEventBtn">
                        <i class="fas fa-plus"></i>
                        Add Event
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Current Date and Controls -->
            <div class="date-controls">
                <button class="date-nav-btn" id="prevWeek">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="current-period">
                    <h2 id="currentPeriod">Week of December 16-22, 2024</h2>
                    <button class="today-btn" id="todayBtn">Today</button>
                </div>
                <button class="date-nav-btn" id="nextWeek">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- Timetable Container -->
            <div class="timetable-container">
                <!-- Week View -->
                <div class="timetable-view week-view active" id="weekView">
                    <div class="timetable-grid">
                        <!-- Time Column -->
                        <div class="time-column">
                            <div class="time-header"></div>
                            <div class="time-slots">
                                <!-- Time slots will be generated by JavaScript -->
                            </div>
                        </div>
                        
                        <!-- Day Columns -->
                        <div class="days-container">
                            <div class="days-header">
                                <div class="day-header" data-day="monday">
                                    <span class="day-name">Monday</span>
                                    <span class="day-date">16</span>
                                </div>
                                <div class="day-header" data-day="tuesday">
                                    <span class="day-name">Tuesday</span>
                                    <span class="day-date">17</span>
                                </div>
                                <div class="day-header" data-day="wednesday">
                                    <span class="day-name">Wednesday</span>
                                    <span class="day-date">18</span>
                                </div>
                                <div class="day-header" data-day="thursday">
                                    <span class="day-name">Thursday</span>
                                    <span class="day-date">19</span>
                                </div>
                                <div class="day-header" data-day="friday">
                                    <span class="day-name">Friday</span>
                                    <span class="day-date">20</span>
                                </div>
                                <div class="day-header weekend" data-day="saturday">
                                    <span class="day-name">Saturday</span>
                                    <span class="day-date">21</span>
                                </div>
                                <div class="day-header weekend" data-day="sunday">
                                    <span class="day-name">Sunday</span>
                                    <span class="day-date">22</span>
                                </div>
                            </div>
                            <div class="days-grid">
                                <!-- Day columns will be generated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Day View -->
                <div class="timetable-view day-view" id="dayView">
                    <div class="day-timetable">
                        <div class="day-events">
                            <!-- Events for selected day will be displayed here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Event Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Event</h3>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form class="modal-form" id="eventForm">
                <div class="form-group">
                    <label for="eventTitle">Event Title</label>
                    <input type="text" id="eventTitle" name="title" required>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" name="description" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDay">Day</label>
                        <select id="eventDay" name="day" required>
                            <option value="monday">Monday</option>
                            <option value="tuesday">Tuesday</option>
                            <option value="wednesday">Wednesday</option>
                            <option value="thursday">Thursday</option>
                            <option value="friday">Friday</option>
                            <option value="saturday">Saturday</option>
                            <option value="sunday">Sunday</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <input type="time" id="startTime" name="startTime" required>
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Time</label>
                        <input type="time" id="endTime" name="endTime" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventCategory">Category</label>
                    <select id="eventCategory" name="category">
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                        <option value="meeting">Meeting</option>
                        <option value="personal">Personal</option>
                        <option value="health">Health</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveBtn">Save Event</button>
                    <button type="button" class="btn-danger" id="deleteBtn" style="display: none;">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
